name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit, build, size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          REPLAY_MODE: "1"
      - run: pnpm size
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/standalone
            .next/static
            public
          retention-days: 1

  e2e:
    name: Playwright (Pixel 7 first)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: next-build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Pixel 7 with throttling (budgets gate everything else)
        run: pnpm e2e --project=pixel7
      - name: iPhone 14 and desktop
        run: pnpm e2e --project=iphone14 --project=desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image boots with better-sqlite3
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t claude-app:ci .
      - name: Boot and probe
        run: |
          docker run -d --name app -p 3000:3000 -e REPLAY_MODE=1 -e BETTER_AUTH_SECRET=ci-secret-0123456789abcdef -e BETTER_AUTH_URL=http://127.0.0.1:3000 -e ADMIN_EMAIL=admin@example.com -e ADMIN_PASSWORD=ci-password-123 claude-app:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health | grep -q '"sqlite":"ok"'; then echo "healthy"; exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
      - run: docker logs app
        if: always()
