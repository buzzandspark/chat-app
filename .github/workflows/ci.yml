name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, unit, build, size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          REPLAY_MODE: "1"
      - run: pnpm size
      # A tarball keeps what an artifact upload would drop: hidden paths (upload-artifact skips
      # .next/standalone/.next and node_modules/.pnpm), pnpm's symlinks, and file modes.
      # public/ is not packed: the e2e job's checkout has it, and scripts/standalone.sh copies it.
      - name: Pack the standalone build
        run: tar -cf next-build.tar .next/standalone .next/static
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tar
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: Playwright (Pixel 7 first)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: next-build
      - name: Unpack the standalone build
        run: |
          tar -xf next-build.tar
          test -f .next/standalone/server.js
      - run: pnpm exec playwright install --with-deps chromium webkit
      # Shared runners miss the frame budgets: misses are annotated and the numbers uploaded, while
      # behaviour assertions still fail the job. Budgets are enforced on local runs.
      - name: Pixel 7 with throttling
        run: pnpm e2e --project=pixel7
        env:
          PERF_BUDGETS: report
      # Before the next Playwright run, which clears test-results/.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: test-results/perf
          if-no-files-found: ignore
          retention-days: 30
      - name: iPhone 14 and desktop
        run: pnpm e2e --project=iphone14 --project=desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image boots with better-sqlite3
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t claude-app:ci .
      - name: Boot and probe
        run: |
          docker run -d --name app -p 3000:3000 -e REPLAY_MODE=1 -e BETTER_AUTH_SECRET=ci-secret-0123456789abcdef -e BETTER_AUTH_URL=http://127.0.0.1:3000 -e ADMIN_EMAIL=admin@example.com -e ADMIN_PASSWORD=ci-password-123 claude-app:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health | grep -q '"sqlite":"ok"'; then echo "healthy"; exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
      - run: docker logs app
        if: always()
